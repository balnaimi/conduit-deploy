###############################################
# Conduit Matrix Server - Complete VPS Setup
# Components: Conduit + Coturn + Caddy (auto TLS)
#
# NOTE: Caddy is the ONLY container with public ports.
# Conduit has NO port mapping — accessed only via
# Docker internal network (matrix). This prevents
# Docker from bypassing ufw/iptables firewall rules.
###############################################

services:
  # ─────────────────────────────────────────────
  # Caddy - Reverse Proxy with auto Let's Encrypt
  # Only container exposed to the internet
  # ─────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"       # Let's Encrypt + HTTP redirect
      - "443:443"     # HTTPS (Matrix clients + federation)
      - "8448:8448"   # Matrix federation (alternative port)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-certs:/data/caddy/certificates  # shared with coturn
    networks:
      - matrix

  # ─────────────────────────────────────────────
  # Conduit - Matrix Homeserver
  # ─────────────────────────────────────────────
  conduit:
    image: ghcr.io/famedly/conduit:next
    container_name: conduit
    restart: unless-stopped
    environment:
      CONDUIT_CONFIG: /etc/conduit.toml
      CONDUIT_SERVER_NAME: ${SERVER_NAME}
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_DATABASE_PATH: /var/lib/matrix-conduit
      CONDUIT_PORT: 6167
      CONDUIT_ADDRESS: 0.0.0.0
      CONDUIT_MAX_REQUEST_SIZE: 1073741824  # 1 GB
      CONDUIT_ALLOW_REGISTRATION: "true"
      CONDUIT_REGISTRATION_TOKEN: ${REGISTRATION_TOKEN}
      CONDUIT_ALLOW_FEDERATION: "true"
      CONDUIT_ALLOW_ENCRYPTION: "true"
      CONDUIT_ALLOW_ROOM_CREATION: "true"
      CONDUIT_TRUSTED_SERVERS: '["matrix.org"]'
      CONDUIT_TURN_URIS: '["turn:${SERVER_NAME}?transport=udp","turn:${SERVER_NAME}?transport=tcp"]'
      CONDUIT_TURN_SECRET: ${TURN_SECRET}
      CONDUIT_WELL_KNOWN_CLIENT: "https://${SERVER_NAME}"
      CONDUIT_WELL_KNOWN_SERVER: "${SERVER_NAME}:443"
    volumes:
      - conduit-data:/var/lib/matrix-conduit
      - ./conduit.toml:/etc/conduit.toml:ro
    networks:
      - matrix
    depends_on:
      - caddy

  # ─────────────────────────────────────────────
  # Coturn - TURN/STUN server for voice/video
  # ─────────────────────────────────────────────
  coturn:
    image: coturn/coturn:alpine
    container_name: coturn
    restart: unless-stopped
    network_mode: host  # required for TURN relay
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
    command: ["-c", "/etc/turnserver.conf"]

volumes:
  conduit-data:
  caddy-data:
  caddy-config:
  caddy-certs:

networks:
  matrix:
    driver: bridge
