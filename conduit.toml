# ─────────────────────────────────────────────
# Conduit Matrix Server Configuration
# Media retention policies (can't be set via env vars)
# ─────────────────────────────────────────────

[global]
# These are set via environment variables in docker-compose.yml
# This file is only for settings that require TOML tables/arrays

# ─────────────────────────────────────────────
# Media Storage
# ─────────────────────────────────────────────
[global.media]
backend = "filesystem"

# ─────────────────────────────────────────────
# Media Retention Policies
# Prevents disk from filling up over time
# ─────────────────────────────────────────────

# Total limit: 10GB for ALL media
[[global.media.retention]]
space = "10GB"

# Remote media (from other servers via federation)
# Delete if not accessed for 30 days OR older than 90 days
[[global.media.retention]]
scope = "remote"
accessed = "30d"
created = "90d"

# Local media (uploaded by your users)
# Delete if not accessed for 1 year
[[global.media.retention]]
scope = "local"
accessed = "365d"

# Thumbnails: max 1GB
[[global.media.retention]]
scope = "thumbnail"
space = "1GB"
